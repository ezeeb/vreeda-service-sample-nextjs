# docker-compose.yml
name: vreeda-service-sample-nextjs

# Usage:
# - Development (HTTP):  docker-compose up
# - Production (HTTPS):  REFRESH_URL="https://host.docker.internal:3000/api/jobs/refresh-tokens?key=your-secure-key" docker-compose up
# - Or set REFRESH_URL in .env file

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - '27017:27017'  # Expose MongoDB on localhost:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongodb_data:/data/db  # Persist data in a Docker volume
  
  token-refresh-task:
    image: curlimages/curl:7.87.0
    container_name: token-refresh-task
    environment:
      - REFRESH_URL=${REFRESH_URL:-http://host.docker.internal:3000/api/jobs/refresh-tokens?key=your-secure-key}
    entrypoint: >
      /bin/sh -c "
      while true; do
        sleep 60;
        echo \"[Token Refresh] Calling: $$REFRESH_URL\";
        curl -f -k -X GET \"$$REFRESH_URL\" && echo \" -> Success\" || echo \" -> Failed\";
      done
      "

  pkce-cleanup-task:
    image: curlimages/curl:7.87.0
    container_name: pkce-cleanup-task
    environment:
      - CLEANUP_URL=${PKCE_CLEANUP_URL:-http://host.docker.internal:3000/api/jobs/cleanup-pkce?key=your-secure-key}
    entrypoint: >
      /bin/sh -c "
      while true; do
        sleep 300;
        echo \"[PKCE Cleanup] Calling: $$CLEANUP_URL\";
        curl -f -k -X GET \"$$CLEANUP_URL\" && echo \" -> Success\" || echo \" -> Failed\";
      done
      "

volumes:
  mongodb_data:
